<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>토실토실 몽이 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5B4A52; --ink2:#8C7A82;
  --pink:#FF8FB0; --pink-d:#E86D93;
  --green:#8FD98F; --green-d:#5FB86B;
  --blue:#8FCBF2; --blue-d:#5AA6DC;
  --yellow:#FFD470; --yellow-d:#E8AE3C;
  --purple:#C6ABEF; --purple-d:#9B7FD4;
  --cream:#FFF9F0; --line:#F0DFE2;
  --sh:0 5px 0 rgba(140,110,120,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:10px;font-family:'Jua',system-ui,sans-serif;color:var(--ink);
  background:#FFEFF3;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
#app{width:100%;max-width:440px}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--purple-d);outline-offset:3px}
.top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.coinpill{display:flex;align-items:center;gap:7px;background:var(--cream);border:4px solid #fff;
  border-radius:30px;padding:5px 14px 5px 6px;box-shadow:var(--sh);font-size:21px;color:#B07A2E}
.coinpill .c{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE59B,#F5B93C);
  border:3px solid #E29A2B;display:grid;place-items:center;font-size:14px}
.iconbtn{width:44px;height:44px;border-radius:15px;border:4px solid #fff;background:var(--pink);
  color:#fff;font-size:19px;box-shadow:var(--sh);padding:0}
.iconbtn.alt{background:var(--blue)} .iconbtn.sv{background:var(--green)}
.spacer{flex:1}
.room{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--sh);height:420px;border:5px solid #fff}
.wall{position:absolute;inset:0}
.floor{position:absolute;left:0;right:0;bottom:0;height:98px}
.rug{position:absolute;left:50%;bottom:12px;width:220px;height:58px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(ellipse at center,#FBD9E2 60%,#F3BDCE)}
.title{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:24px;color:#fff;
  text-shadow:0 0 6px #F2879F,3px 3px 0 #E86D93,-2px 2px 0 #E86D93,2px -2px 0 #E86D93,-2px -2px 0 #E86D93;pointer-events:none}
/* 성장 패널 */
.grow{position:absolute;z-index:6;top:42px;left:50%;transform:translateX(-50%);width:82%;
  background:rgba(255,255,255,.94);border-radius:22px;padding:8px 14px 10px;box-shadow:0 3px 0 rgba(140,110,120,.14)}
.grow .l1{display:flex;align-items:baseline;gap:6px;font-size:17px;margin-bottom:5px}
.grow .l1 b{font-size:20px;color:var(--pink-d);font-weight:400}
.grow .l1 span.r{margin-left:auto;font-size:14px;color:var(--ink2)}
.gauge{height:16px;background:#EFE6E8;border-radius:10px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#FFD470,#8FD98F);transition:width .6s}
.props{position:absolute;left:0;right:0;bottom:80px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px;pointer-events:none}
.props img{height:70px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}
.petstage{position:absolute;left:50%;bottom:14px;width:193px;height:280px;cursor:pointer;
  transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.petwrap{position:absolute;inset:0;transform-origin:50% 100%}
.pz1{animation:bob1 3.6s ease-in-out infinite}
.pz2{animation:sway 3s ease-in-out infinite}
.pz3{animation:bob2 2.4s ease-in-out infinite}
.pz4{animation:bounce 1.9s ease-in-out infinite}
.pz5{animation:step 2.2s ease-in-out infinite}
.pz6{animation:hop 1.5s ease-in-out infinite}
@keyframes bob1{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-13px) scaleY(1.03)}60%{transform:translateY(0) scaleY(.97)}}
@keyframes step{0%,100%{transform:translateX(-7px) rotate(-2deg)}50%{transform:translateX(7px) rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-26px) scale(1.02)}55%{transform:translateY(0) scale(.98)}}
.aura{position:absolute;inset:-14px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(255,214,102,.55),rgba(255,214,102,0) 62%);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
.petstage.jump .petwrap{animation:jump .7s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jump{0%{transform:translateY(0)}25%{transform:translateY(-32px) rotate(-5deg)}55%{transform:translateY(0)}75%{transform:translateY(-11px)}100%{transform:translateY(0)}}
.petbase{position:absolute;left:50%;top:0;transform:translateX(-50%);height:100%;filter:drop-shadow(0 5px 3px rgba(0,0,0,.10))}
.layer{position:absolute}
.sidebtn{position:absolute;bottom:14px;width:78px;padding:8px 0 6px;border-radius:20px;border:4px solid #fff;
  background:var(--cream);box-shadow:var(--sh);font-size:16px;text-align:center;color:var(--ink)}
.sidebtn em{display:block;font-style:normal;font-size:26px;line-height:1.1}
.sidebtn.l{left:10px} .sidebtn.r{right:10px}
/* 연습 버튼 */
.mainbtn{width:100%;margin-top:12px;border:5px solid #fff;border-radius:28px;padding:16px 10px 14px;
  background:linear-gradient(#FFC24D,#F79E2B);color:#fff;font-size:27px;box-shadow:0 7px 0 #D9832090;
  text-shadow:0 3px 0 #D98320;animation:breathe 2.4s ease-in-out infinite}
.mainbtn em{font-style:normal;font-size:30px;margin-right:6px}
.mainbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #D9832090}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.sub{text-align:center;font-size:14px;color:var(--ink2);margin-top:8px}
/* 오버레이 */
.ov{position:fixed;inset:0;background:rgba(90,70,80,.5);display:none;justify-content:center;align-items:center;padding:10px;z-index:60}
.ov.on{display:flex}
.ov#ovStart{background:linear-gradient(#FFE3EC,#FFF1F5);z-index:80}
.sheet{background:#fff;border:5px solid var(--line);border-radius:28px;width:100%;max-width:440px;max-height:94vh;overflow:auto;padding:16px}
.sheet h2{margin:0 0 10px;font-size:22px;font-weight:400}
.btn{border:none;border-radius:20px;padding:12px 20px;font-size:19px;color:#fff;background:var(--pink);box-shadow:0 4px 0 var(--pink-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-d)}
.btn.ghost{background:#fff;color:var(--ink2);border:3px solid var(--line);box-shadow:none}
.btn.small{font-size:15px;padding:9px 14px;border-radius:16px}
.btn.go{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.slot{border:4px solid var(--line);border-radius:22px;padding:10px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.slot .mini{width:76px;height:110px;position:relative;flex:0 0 auto}
.slot .info{flex:1;font-size:15px;line-height:1.6;color:var(--ink2)}
.slot .info b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(70,55,62,.92);color:#fff;
  padding:10px 20px;border-radius:20px;font-size:16px;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
/* 문제 */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:17px}
.pips{margin-left:auto;font-size:19px;letter-spacing:2px}
.qbox{text-align:center;padding:14px 0 18px}
.q{font-size:58px;letter-spacing:2px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{font-size:38px;padding:20px 0;border-radius:24px;border:5px solid var(--line);background:#FFFDFA;color:var(--ink);min-height:92px;box-shadow:0 5px 0 rgba(140,110,120,.14)}
.choice:active{transform:translateY(3px)}
.choice.right{background:#E7F8E9;border-color:var(--green)}
.choice.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.fix{text-align:center}
.eq{font-size:54px;color:var(--pink-d);margin:4px 0 10px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:8px}
.grp{display:flex;gap:5px;background:#FFF2F6;border-radius:14px;padding:7px 9px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pink)}
.skip{font-size:21px;color:var(--ink2);margin-bottom:8px}
.skip b{color:var(--pink-d);font-weight:400}
.fixmsg{font-size:19px;margin-bottom:10px}
.done{text-align:center;padding:6px 0}
.done .msg{font-size:23px;margin:10px 0}
.reward{display:inline-block;background:#FFF2F6;border-radius:18px;padding:9px 18px;font-size:19px;margin-bottom:14px}
/* 상점 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tab{flex:0 0 auto;font-size:14px;padding:8px 13px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink2)}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.item{border:4px solid var(--line);border-radius:20px;background:#FFFDFA;padding:8px 4px 6px;text-align:center;color:var(--ink)}
.item.sel{border-color:var(--pink);background:#FFF2F6}
.item .th{height:72px;display:grid;place-items:center}
.item .th img{max-height:72px;max-width:100%}
.item .sw{width:46px;height:46px;border-radius:14px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.item .nm{font-size:12.5px;line-height:1.25;min-height:30px;margin:4px 0 2px}
.item .pr{font-size:13px;color:#B07A2E}
.item .own{font-size:13px;color:var(--green-d)}
.item.sil img{filter:brightness(0) opacity(.13)}
.item.sil .sw{background:#E7DEE0!important}
.buybar{position:sticky;bottom:0;background:#fff;padding-top:10px;margin-top:10px;border-top:3px solid var(--line);display:flex;gap:8px;align-items:center}
.buybar .info{flex:1;font-size:14px;color:var(--ink2)}
.notice{color:var(--pink-d)}
.hint{font-size:13px;color:var(--ink2);margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:2px solid var(--line);padding:7px 3px;text-align:center}
th{color:var(--ink2)}
.tsum{font-size:15px;line-height:1.75}
/* 폭죽 */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.cf{position:absolute;width:11px;height:16px;border-radius:3px;animation:fall 1.9s linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (max-width:380px){.q{font-size:48px}.choice{font-size:32px;min-height:80px}.mainbtn{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="coinpill"><span class="c">🐰</span><b id="coins">20</b></div>
    <span class="spacer"></span>
    <span class="coinpill" style="font-size:15px;padding:8px 12px" id="stagechip">1단계</span>
    <button class="iconbtn sv" id="btnSave" title="저장하기">💾</button>
    <button class="iconbtn alt" id="btnTeacher" title="선생님 보기">👩‍🏫</button>
    <button class="iconbtn" id="btnSound" title="소리">🔊</button>
  </div>
  <div class="room" id="room">
    <div class="wall" id="wall"></div>
    <div class="floor" id="floor"></div>
    <div class="rug"></div>
    <div class="title">토실토실 몽이 키우기</div>
    <div class="grow">
      <div class="l1">🌱 <b id="stageName">아기 몽이</b> <span id="tableNow">· 2단 연습 중</span><span class="r" id="growTxt">0 / 18</span></div>
      <div class="gauge"><i id="growBar" style="width:0%"></i></div>
    </div>
    <div class="props" id="props"></div>
    <div class="petstage" id="petstage"><div class="petwrap" id="petwrap"></div></div>
    <button class="sidebtn l" id="btnShop"><em>🏪</em>상점</button>
    <button class="sidebtn r" id="btnCloset"><em>🚪</em>옷장</button>
  </div>
  <button class="mainbtn" id="btnPractice"><em>✏️</em>구구단 연습하기</button>
  <p class="sub" id="subMsg">문제를 맞히면 몽이가 자라고 코인을 모아요!</p>
</div>
<div class="ov" id="ovQuiz"><div class="sheet" id="quizSheet"></div></div>
<div class="ov" id="ovPanel"><div class="sheet" id="panelSheet"></div></div>
<div class="ov" id="ovAlert"><div class="sheet" id="alertSheet" style="max-width:370px;text-align:center"></div></div>
<div class="ov on" id="ovStart"><div class="sheet" id="startSheet"></div></div>
<div class="toast" id="toast"></div>
<div id="confetti"></div>

function pickKey(){
  const due=S.retry.find(r=>r.due<=S.asked);
  if(due){S.retry=S.retry.filter(r=>r!==due);return{key:due.key,retry:true}}
  const cur=curTable();
  const cleared=ORDER.slice(0,S.stage-1);
  let t=cur;
  if(!cur)t=ORDER[Math.floor(Math.random()*ORDER.length)];
  else if(cleared.length&&Math.random()<.2)t=cleared[Math.floor(Math.random()*cleared.length)];
  const pool=[];
  for(let b=1;b<=9;b++){const k=t+'x'+b;if(k===S.lastKey)continue;pool.push({k,w:st(k).weight})}
  const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;
  for(const x of pool){r-=x.w;if(r<=0)return{key:x.k,retry:false}}
  return{key:pool[0].k,retry:false};
}
function distractors(a,b){
  const ans=a*b,set=new Set();
  const pick=arr=>{const v=arr[Math.floor(Math.random()*arr.length)];if(v>0&&v!==ans)set.add(v)};
  pick([ans+a,ans-a]);pick([a+b]);pick([ans+1,ans-1,ans+2,ans-2]);
  let i=0;while(set.size<3&&i<25){pick([ans+a,ans-a,a+b,ans+1,ans-1,ans+2,ans-2,ans+2*a]);i++}
  return[...set].slice(0,3);
}
let Q=null;
function startPractice(){Q={need:SESSION,filled:0,coin:0,cur:null,wrongOnCur:0,locked:false};S.asked=0;$('ovQuiz').classList.add('on');nextQuestion()}
function nextQuestion(){
  const{key,retry}=pickKey();const[a,b]=key.split('x').map(Number);
  const opts=[a*b,...distractors(a,b)].sort(()=>Math.random()-.5);
  Q.cur={key,a,b,ans:a*b,opts,retry};Q.wrongOnCur=0;Q.locked=false;S.lastKey=key;S.asked++;
  drawQuestion();speak(`${a} 곱하기 ${b}는?`);
}
function drawQuestion(limit){
  const q=Q.cur;let opts=q.opts;const wt=st(q.key).wrong;
  if(limit===2||(wt>=3&&limit!==1))opts=[q.ans,q.opts.find(o=>o!==q.ans)].sort(()=>Math.random()-.5);
  if(limit===1||wt>=4)opts=[q.ans];
  const pips=Array.from({length:Q.need},(_,i)=>i<Q.filled?'⭐':'⚪').join(' ');
  $('quizSheet').innerHTML=`
   <div class="qhead"><span>✏️ ${curTable()?curTable()+'단 연습':'전체 복습'}</span><span class="pips">${pips}</span></div>
   <div class="qbox"><span class="q">${q.a} × ${q.b} = ?</span>
     <button class="iconbtn alt" id="btnSpeak" style="width:40px;height:40px;font-size:17px;vertical-align:middle">🔊</button></div>
   <div class="choices" id="choices">${opts.map(o=>`<button class="choice" data-v="${o}">${o}</button>`).join('')}</div>
   <div style="text-align:center;margin-top:14px"><button class="btn ghost small" id="btnQuit">나중에 하기</button></div>`;
  $('btnSpeak').onclick=()=>speak(`${q.a} 곱하기 ${q.b}는?`);
  $('btnQuit').onclick=()=>{$('ovQuiz').classList.remove('on');Q=null;renderAll();save(true)};
  document.querySelectorAll('#choices .choice').forEach(el=>el.onclick=()=>answer(+el.dataset.v,el));
}
function record(key,ok){
  const t=+key.split('x')[0];
  S.count[t]=(S.count[t]||0)+1;
  S.recent[t]=S.recent[t]||[];S.recent[t].push(ok?1:0);if(S.recent[t].length>12)S.recent[t].shift();
  if(ok)S.right[t]=(S.right[t]||0)+1;
}
function answer(v,el){
  if(Q.locked)return;const q=Q.cur,s=st(q.key);s.seen++;S.totalQ++;
  if(v===q.ans){
    Q.locked=true;s.correct++;s.streak++;S.totalC++;
    if(s.streak>=3)s.weight=Math.max(.3,s.weight*.5);
    if(q.retry)s.weight=Math.max(1,s.weight-1);
    el.classList.add('right');record(q.key,true);sfxGood();
    S.coins+=2;Q.coin+=2;
    if(!q.retry)Q.filled++;
    renderGrow();
    setTimeout(()=>{Q.filled>=Q.need?finishSession():nextQuestion()},620);
  }else{
    /* 벌점 없음: 코인·진행도 그대로 두고 힌트만 보여준다 */
    s.wrong++;s.streak=0;s.weight+=3;record(q.key,false);Q.wrongOnCur++;sfxSoft();showFix();
  }
}
function showFix(){
  const q=Q.cur;
  const groups=Array.from({length:q.b},()=>`<span class="grp">${Array.from({length:q.a},()=>'<i class="dot"></i>').join('')}</span>`).join('');
  const skip=[];for(let i=1;i<=q.b;i++)skip.push(i===q.b?`<b>${q.a*i}</b>`:q.a*i);
  $('quizSheet').innerHTML=`<div class="fix">
    <div class="fixmsg">이건 이렇게 되는 거야!</div>
    <div class="eq">${q.a} × ${q.b} = ${q.ans}</div>
    <div class="dots">${groups}</div>
    <div class="skip">${q.a}개씩 ${q.b}묶음 → ${skip.join(' - ')}</div>
    <div class="fixmsg">몽이랑 같이 <b>${q.ans}</b>를 눌러 볼까?</div>
    <div class="choices" style="grid-template-columns:1fr"><button class="choice pulse" id="fixBtn">${q.ans}</button></div></div>`;
  speak(`${q.a} 곱하기 ${q.b}는 ${q.ans}. 같이 눌러 보자.`);
  $('fixBtn').onclick=()=>{
    sfxGood();$('fixBtn').classList.remove('pulse');$('fixBtn').classList.add('right');
    if(!S.retry.some(r=>r.key===q.key))S.retry.push({key:q.key,due:S.asked+2});
    setTimeout(()=>{Q.wrongOnCur>=3?drawQuestion(1):nextQuestion()},700);
  };
}

  $('panelSheet').innerHTML=`
   <h2>${closet?'🚪 옷장':'🏪 상점'}<span style="float:right;font-size:18px;color:#B07A2E">🪙 ${S.coins}</span></h2>
   ${closet?`<p class="hint">모은 아이템 ${own} / ${all} · 흐린 칸은 아직 없는 아이템이에요.</p>`:''}
   <div class="tabs">${CATS.map(c=>`<button class="tab ${c.k===cat?'on':''}" data-cat="${c.k}">${c.n}${S.stage<c.lv?' 🔒':''}</button>`).join('')}</div>
   ${locked?`<p class="hint notice">몽이가 ${C.lv}단계가 되면 열려요. 구구단을 연습하면 금방 열립니다!</p>`:''}
   <div class="grid" style="${locked?'opacity:.35;pointer-events:none':''}">${cards}</div>
   <div class="buybar"><span class="info" id="info">아이템을 누르면 몽이에게 입혀 볼 수 있어요.</span>
     <button class="btn ghost small" id="btnClose">닫기</button></div>`;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cat=t.dataset.cat;pv=null;drawPanel();renderRoom()});
  document.querySelectorAll('.item[data-id]').forEach(b=>b.onclick=()=>tapItem(b.dataset.id));
  $('btnClose').onclick=()=>{$('ovPanel').classList.remove('on');pv=null;renderAll();save(true)};
}
function previewObj(it){
  const s=slotOf(it);
  if(s==='prop')return{props:[...(S.eq.props||[]).slice(-1),it.id]};
  const o={};o[s]=it.id;return o;
}
function equip(it){
  const s=slotOf(it);
  if(s==='prop'){const p=S.eq.props||[];S.eq.props=p.includes(it.id)?p.filter(x=>x!==it.id):[...p,it.id].slice(-2);return}
    const keep=['body','theme'];
  S.eq[s]=(S.eq[s]===it.id&&!keep.includes(s))?null:it.id;
}
function tapItem(id){
  const it=findItem(id);
  if(S.owned.has(id)){equip(it);drawPanel();renderRoom();save(true);return}
  pv=previewObj(it);renderRoom(pv);
  const short=it.p-S.coins;
  $('info').innerHTML=short>0?`<span class="notice">문제 ${Math.ceil(short/2)}개만 더 맞히면 살 수 있어요!</span>`:`${it.n} · 🪙 ${it.p}`;
  const bar=document.querySelector('.buybar'),old=$('btnBuy');if(old)old.remove();
  const b=document.createElement('button');b.className='btn small';b.id='btnBuy';
  b.textContent=short>0?'조금 더 모으기':'구매하기';
  b.onclick=()=>{
    if(short>0){$('ovPanel').classList.remove('on');pv=null;renderAll();return}
    S.coins-=it.p;S.owned.add(it.id);
    equip(it);sfxCoin();pv=null;drawPanel();renderAll();save(true);
  };
  bar.insertBefore(b,$('btnClose'));
  document.querySelectorAll('.item[data-id]').forEach(x=>x.classList.toggle('sel',x.dataset.id===id));
}

/* ===== 선생님 보기 ===== */
function openTeacher(){
  const rows=ORDER.map(t=>{
    const cnt=S.count[t]||0;if(!cnt)return'';
    let seen=0,cor=0;for(let b=1;b<=9;b++){const s=S.stats[t+'x'+b];if(s){seen+=s.seen;cor+=s.correct}}
    const r=seen?Math.round(cor/seen*100):0;
    const idx=ORDER.indexOf(t)+1;
    const state=idx<S.stage?'통과':(t===curTable()?'연습 중':'—');
    return`<tr><td>${t}단</td><td>${cnt}</td><td>${r}%</td><td>${rightOf(t)}/${NEED}</td><td>${state}</td></tr>`}).join('');
  const worst=Object.entries(S.stats).filter(([,s])=>s.wrong>0).sort((a,b)=>b[1].wrong-a[1].wrong).slice(0,3)
    .map(([k,s])=>{const[a,b]=k.split('x');return`${a}×${b} (${s.wrong}회)`}).join(', ')||'아직 없어요';
  const min=Math.max(1,Math.round((S.playMs+(Date.now()-S.start))/60000)),r=S.totalQ?Math.round(S.totalC/S.totalQ*100):0;
  $('panelSheet').innerHTML=`<h2>👩‍🏫 선생님 보기 <span style="font-size:15px;color:#8C7A82">(${S.profile}번 몽이)</span></h2>
   <p class="tsum">푼 문제 <b>${S.totalQ}개</b> · 첫 시도 정답률 <b>${r}%</b> · 학습 시간 <b>약 ${min}분</b><br>
   자주 틀리는 문제: <b>${worst}</b><br>성장 단계: <b>${S.stage}단계 ${STAGE[S.stage-1].n}</b> · 현재 <b>${curTable()?curTable()+'단':'전체 복습'}</b></p>
   <table><tr><th>단</th><th>푼 문제</th><th>정답률</th><th>성장</th><th>상태</th></tr>${rows||'<tr><td colspan="5">아직 기록이 없습니다.</td></tr>'}</table>
   <p class="hint">* 이 화면의 수치는 학생 화면에 표시되지 않습니다.<br>
   * 통과 조건: 해당 단 <b>${NEED}문제 정답</b> 또는 최근 12문제 중 11개 이상 정답.<br>
   * 틀려도 코인·진행도가 깎이지 않습니다.</p>
   <div class="buybar"><span class="info"></span>
     <button class="btn ghost small" id="btnBackup">📤 백업</button>
     <button class="btn ghost small" id="btnSwitch">몽이 바꾸기</button>
     <button class="btn ghost small" id="btnClose">닫기</button></div>`;
  $('btnClose').onclick=()=>$('ovPanel').classList.remove('on');
  $('btnBackup').onclick=exportBackup;
  $('btnSwitch').onclick=()=>{save(true);$('ovPanel').classList.remove('on');drawStart();$('ovStart').classList.add('on')};
  $('ovPanel').classList.add('on');
}
function alertBox(t,ic,html,img){
  $('alertSheet').innerHTML=`${img?`<img src="${img}" style="height:150px">`:`<div style="font-size:50px">${ic}</div>`}
   <h2 style="margin:6px 0">${t}</h2>
   <p style="font-size:18px;line-height:1.6">${html}</p><button class="btn" id="btnAlertOk">좋아!</button>`;
  $('btnAlertOk').onclick=()=>{$('ovAlert').classList.remove('on');renderAll()};
  $('ovAlert').classList.add('on');
}

/* ===== 저장 / 이어서 하기 ===== */
function snapshot(){
  return{v:2,coins:S.coins,stage:S.stage,right:S.right,eq:S.eq,owned:[...S.owned],
    quiz:S.stats,count:S.count,recent:S.recent,retry:S.retry,
    totalQ:S.totalQ,totalC:S.totalC,playMs:S.playMs+(Date.now()-S.start),last:Date.now()};
}
function save(silent){
  const all=allSaves();all['p'+S.profile]=snapshot();
  DB.set(PKEY,JSON.stringify(all));
  const ok=(DB.get(PKEY)||'').indexOf('"p'+S.profile+'"')>=0;
  if(!silent){
    const t=new Date(),hh=t.getHours(),mm=('0'+t.getMinutes()).slice(-2);
    toast(ok&&DB.ok?`저장했어요! 💾 (${hh}:${mm})`:'이 화면에서는 저장이 남지 않아요. 백업 파일로 내보내세요');
  }
}
/* 백업 파일 내보내기 / 불러오기 */
function exportBackup(){
  save(true);
  const d=new Date(),ymd=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
  const blob=new Blob([DB.get(PKEY)||'{}'],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='몽이_저장_'+ymd+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('백업 파일을 내려받았어요 📤');
}
function importBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        const cur=allSaves();
        for(const k in d)if(k[0]==='p')cur[k]=d[k];
        DB.set(PKEY,JSON.stringify(cur));
        drawStart();toast('백업을 불러왔어요 📥');
      }catch(e){alert('저장 파일을 읽지 못했어요. 다른 파일을 골라 주세요.')}
    };
    r.readAsText(f);
  };
  inp.click();
}
function loadInto(d){
  S.coins=d.coins||0;S.stage=Math.min(9,Math.max(1,d.stage||1));S.right=d.right||{};
  S.eq=Object.assign({body:'b_cream',outfit:null,theme:'t_pink',props:[]},d.eq||{});
  S.owned=new Set(d.owned||['b_cream','t_pink']);
  S.stats=d.quiz||{};S.count=d.count||{};S.recent=d.recent||{};S.retry=d.retry||[];
  S.totalQ=d.totalQ||0;S.totalC=d.totalC||0;S.playMs=d.playMs||0;S.start=Date.now();
}
function agoText(ts){
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return'방금 전';if(m<60)return m+'분 전';
  const h=Math.round(m/60);if(h<24)return h+'시간 전';
  return Math.round(h/24)+'일 전';
}
function statusText(){
  if(!DB.ok)return'<span class="notice">※ 이 화면에서는 기록이 저장되지 않습니다. 파일을 내려받아 실행해 주세요.</span>';
  if(INFRAME)return'<span class="notice">※ 미리보기 화면입니다. 껐다 켜면 기록이 사라질 수 있으니, 파일을 내려받아 실행하거나 백업 파일을 저장해 두세요.</span>';
  return'이 기기에 자동으로 저장됩니다 ✔';
}
function drawStart(){
  const all=allSaves();
  const slots=[1,2,3].map(i=>{
    const d=all['p'+i];
    if(!d)return`<div class="slot"><div class="mini" style="display:grid;place-items:center;font-size:34px">🐰</div>
      <div class="info"><b>${i}번 몽이</b><br>아직 시작하지 않았어요</div>
      <button class="btn small" data-new="${i}">새로 시작하기</button></div>`;
    const stg=STAGE[Math.min(9,d.stage||1)-1],tb=(d.stage||1)<=8?ORDER[(d.stage||1)-1]+'단 연습 중':'전체 복습';
    return`<div class="slot"><div class="mini">${petHTML(Object.assign({body:'b_cream',theme:'t_pink',props:[]},d.eq||{}),d.stage||1)}</div>
      <div class="info"><b>${i}번 몽이</b><br>${d.stage||1}단계 ${stg.n} · ${tb}<br>🪙 ${d.coins||0} · ${agoText(d.last||Date.now())}</div>
      <div style="display:grid;gap:6px"><button class="btn small go" data-load="${i}">이어서 하기</button>
      <button class="btn ghost small" data-reset="${i}">처음부터</button></div></div>`;
  }).join('');
  $('startSheet').innerHTML=`
    <h2 style="text-align:center;font-size:27px">🐰 토실토실 몽이 키우기</h2>
    <p class="hint" style="text-align:center;margin-bottom:12px">누구의 몽이를 키울까요?</p>
    ${slots}
    <p class="hint" style="text-align:center">${statusText()}</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
      <button class="btn ghost small" id="btnExport">📤 백업 저장</button>
      <button class="btn ghost small" id="btnImport">📥 백업 불러오기</button>
    </div>`;
  $('btnExport').onclick=exportBackup; $('btnImport').onclick=importBackup;
  $('startSheet').querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>startGame(+b.dataset.new,null));
  $('startSheet').querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>startGame(+b.dataset.load,allSaves()['p'+b.dataset.load]));
  $('startSheet').querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{
    if(confirm(b.dataset.reset+'번 몽이의 기록을 지우고 처음부터 시작할까요?')){
      const a=allSaves();delete a['p'+b.dataset.reset];DB.set(PKEY,JSON.stringify(a));drawStart();}
  });
  $('petstage').style.transform='translateX(-50%) scale('+STAGE[S.stage-1].s+')';
}
function startGame(p,data){
  S.profile=p;
  if(data)loadInto(data);
  else Object.assign(S,{coins:20,stage:1,right:{},
    eq:{body:'b_cream',outfit:null,theme:'t_pink',props:[]},
    owned:new Set(['b_cream','t_pink']),stats:{},recent:{},count:{},retry:[],
    totalQ:0,totalC:0,playMs:0,start:Date.now()});
  $('ovStart').classList.remove('on');
  renderAll();save(true);
}

/* ===== 이벤트 ===== */
$('btnPractice').onclick=startPractice;
$('btnShop').onclick=()=>openPanel('shop');
$('btnCloset').onclick=()=>openPanel('closet');
$('btnTeacher').onclick=openTeacher;
$('btnSave').onclick=()=>save(false);
$('btnSound').onclick=()=>{S.sound=!S.sound;$('btnSound').textContent=S.sound?'🔊':'🔈';
  if(!S.sound&&'speechSynthesis'in window)speechSynthesis.cancel()};
$('petstage').onclick=()=>{jump();tone(760,.1)};
setInterval(()=>{if(!$('ovStart').classList.contains('on'))save(true)},30000);
function autoSave(){if(!$('ovStart').classList.contains('on'))save(true)}
window.addEventListener('beforeunload',autoSave);
window.addEventListener('pagehide',autoSave);
window.addEventListener('blur',autoSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autoSave()});
drawStart();
renderAll();
</script>
</body>
</html>
